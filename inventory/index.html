<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Inventory</title>
        <script type="module" src="/src/inventoryPage.ts"></script>
    </head>
    <body>
        <main class="inventory-page">
            <section class="inventory-shell" aria-labelledby="inventory-title">
                <header class="page-header">
                    <div>
                        <p class="eyebrow">System Design Practice</p>
                        <h1 id="inventory-title">Inventory</h1>
                    </div>
                    <button id="reset-button" class="secondary-button" type="button">Reset</button>
                </header>

                <section class="held-panel" aria-label="Held item">
                    <div id="held-slot" class="held-slot"></div>
                </section>

                <section class="money-panel" aria-label="Money">
                    <div class="money-row">
                        <span class="money-label">Money:</span>
                        <div id="money-display" class="money-display"></div>
                    </div>
                    <button id="sell-held-button" class="secondary-button" type="button">Sell Held Item</button>
                </section>

                <div id="slot-grid" class="slot-grid" aria-label="Inventory slots"></div>

                <section class="control-panel" aria-label="Add items">
                    <button class="item-button" type="button" data-item-id="health-potion" data-quantity="8">
                        Add 8 Potions
                    </button>
                    <button class="item-button" type="button" data-item-id="apple" data-quantity="12">
                        Add 12 Apples
                    </button>
                    <button class="item-button" type="button" data-item-id="sword" data-quantity="1">
                        Add Sword
                    </button>
                </section>

                <output id="result-output" class="result-output" aria-live="polite"></output>
            </section>

            <dialog id="quantity-dialog" class="quantity-dialog">
                <form id="quantity-form" method="dialog">
                    <h2 id="quantity-title">Take Quantity</h2>
                    <input id="quantity-slider" class="quantity-slider" type="range" min="1" value="1" />
                    <label class="quantity-field">
                        Amount
                        <input id="quantity-input" type="number" min="1" value="1" />
                    </label>
                    <div class="dialog-actions">
                        <button class="secondary-button" type="button" id="quantity-cancel-button">Cancel</button>
                        <button class="item-button" type="submit">Take</button>
                    </div>
                </form>
            </dialog>
        </main>
    </body>
</html>
